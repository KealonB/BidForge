<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111827"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="BidForge"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>BidForge v1.1</title>
<style>
:root{--bg:#0b1220;--panel:#111827;--card:#172033;--input:#0d1628;--text:#f8fafc;--muted:#9ca3af;--accent:#f59e0b;--line:#2b364a;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted)}
main{max-width:820px;margin:auto;padding:14px 14px 105px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 8px 22px rgba(0,0,0,.08)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.row4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
label{display:block;color:var(--muted);font-size:12px;margin:8px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--input);color:var(--text)}textarea{min-height:76px;resize:vertical}
button{border:0;border-radius:11px;padding:11px 13px;background:var(--accent);color:#111827;font-weight:750}.secondary{background:#273449;color:var(--text)}.danger{background:#4b1f26;color:#fecaca}.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--panel) 95%,transparent);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}nav button{background:transparent;color:var(--muted);padding:8px 2px;font-size:12px}nav button.active{color:var(--accent)}
.hidden{display:none!important}.money{font-size:34px;font-weight:850;letter-spacing:-1px}.totals{display:grid;grid-template-columns:1fr auto;gap:8px}.totals div:nth-child(even){font-weight:700;text-align:right}.item{padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.small{font-size:12px;color:var(--muted)}.tiny{font-size:11px;color:var(--muted)}.pill{display:inline-block;border:1px solid var(--line);padding:4px 8px;border-radius:999px;font-size:11px;color:var(--muted);margin:2px}.pill.accent{border-color:var(--accent);color:var(--accent)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:110px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.tabs .selected{outline:2px solid var(--accent)}.assemblybox{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.right{text-align:right}.divider{height:1px;background:var(--line);margin:12px 0}.warn{border-color:#7c5a13;background:#352b14}.success{border-color:#27563c;background:#163322}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:8px}.search{margin-bottom:10px}
@media(max-width:560px){.row,.row3,.row4{grid-template-columns:1fr}.money{font-size:30px}.desktopOnly{display:none}}
@media print{header,nav,.noPrint{display:none!important}body{background:white;color:black}.card,.assemblybox{border:1px solid #bbb;background:white;color:black;box-shadow:none}.sub,.small,.tiny,label{color:#444}main{padding:0}}
</style>
</head>
<body>
<header><h1>BidForge <span class="pill accent">v1.1</span></h1><div class="sub">Low-voltage estimating • assemblies • local-first</div></header>
<main><section id="projects"></section><section id="takeoff" class="hidden"></section><section id="summary" class="hidden"></section><section id="settings" class="hidden"></section></main>
<nav><button data-tab="projects" class="active">Projects</button><button data-tab="takeoff">Takeoff</button><button data-tab="summary">Summary</button><button data-tab="settings">Settings</button></nav>
<script>
const KEY="bidforge.v1";
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const seedItems=[
{name:"Cat6 Data Drop",cat:"Copper",unit:"EA",material:42,laborHours:1.25},
{name:"Cat6A Data Drop",cat:"Copper",unit:"EA",material:65,laborHours:1.5},
{name:"Coax Run",cat:"Copper / Coax",unit:"EA",material:55,laborHours:1.25},
{name:"6-Strand Singlemode Fiber",cat:"Fiber",unit:"FT",material:.85,laborHours:.012},
{name:"12-Strand Singlemode Fiber",cat:"Fiber",unit:"FT",material:1.25,laborHours:.014},
{name:"24-Strand Singlemode Fiber",cat:"Fiber",unit:"FT",material:2.15,laborHours:.018},
{name:"6-Strand OM4 Fiber",cat:"Fiber",unit:"FT",material:1.10,laborHours:.012},
{name:"Fusion Splice",cat:"Fiber",unit:"EA",material:4,laborHours:.18},
{name:"Fiber Termination",cat:"Fiber",unit:"EA",material:12,laborHours:.25},
{name:"OTDR Test",cat:"Testing",unit:"STRAND",material:0,laborHours:.12},
{name:"Cat6 Certification Test",cat:"Testing",unit:"EA",material:0,laborHours:.08},
{name:"J-Hook",cat:"Pathway",unit:"EA",material:8.5,laborHours:.12},
{name:"Cable Tray",cat:"Pathway",unit:"FT",material:19,laborHours:.15},
{name:'2" Speed Sleeve',cat:"Pathway / Firestop",unit:"EA",material:145,laborHours:.75},
{name:'4" Speed Sleeve',cat:"Pathway / Firestop",unit:"EA",material:265,laborHours:1},
{name:'2" EZ-Path',cat:"Pathway / Firestop",unit:"EA",material:250,laborHours:.8},
{name:'4" EZ-Path',cat:"Pathway / Firestop",unit:"EA",material:520,laborHours:1.1},
{name:"2-Post Rack",cat:"Equipment",unit:"EA",material:420,laborHours:2},
{name:"4-Post Rack",cat:"Equipment",unit:"EA",material:950,laborHours:3.5},
{name:"24-Port Patch Panel",cat:"Equipment",unit:"EA",material:110,laborHours:.55},
{name:"48-Port Patch Panel",cat:"Equipment",unit:"EA",material:185,laborHours:.8},
{name:"Firestop Penetration",cat:"Firestop",unit:"EA",material:18,laborHours:.25},
{name:"Low-Voltage Demolition",cat:"Demo",unit:"HR",material:0,laborHours:1}
];
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{settings:{laborRate:70,tax:9.125,overhead:10,profit:10,accent:"#f59e0b",background:"#0b1220"},items:seedItems,assemblies:[],projects:[],active:null};
function migrate(){
 db.settings=db.settings||{}; if(!db.settings.background)db.settings.background="#0b1220"; if(!db.settings.accent)db.settings.accent="#f59e0b";
 db.items=db.items||seedItems; db.items.forEach(i=>{if(!i.id)i.id=uid()}); db.assemblies=db.assemblies||[];
 // Add requested v1.1 Division 27 items if missing.
 const names=new Set(db.items.map(i=>i.name.toLowerCase())); seedItems.forEach(s=>{if(!names.has(s.name.toLowerCase()))db.items.push({...s,id:uid()})});
 db.projects=db.projects||[];
 // Convert old index-based project lines into frozen snapshots.
 db.projects.forEach(p=>{p.lines=p.lines||[];p.lines=p.lines.map(l=>{
   if(l.snapshot)return l;
   const i=typeof l.item==="number"?db.items[l.item]:db.items.find(x=>x.id===l.itemId);
   if(!i)return null;
   return {id:uid(),kind:"item",qty:+l.qty||0,name:i.name,unit:i.unit,cat:i.cat,snapshot:{material:+i.material||0,laborHours:+i.laborHours||0,components:[]}};
 }).filter(Boolean)});
 save();
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function active(){return db.projects.find(p=>p.id===db.active)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function money(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0)}
function calcLine(l,p){let m=(l.snapshot?.material||0)*l.qty,h=(l.snapshot?.laborHours||0)*l.qty,lab=h*(p.laborRate??db.settings.laborRate);return{material:m,labor:lab,hours:h,total:m+lab}}
function calc(p){let material=0,labor=0,hours=0;(p.lines||[]).forEach(l=>{let x=calcLine(l,p);material+=x.material;labor+=x.labor;hours+=x.hours});let direct=material+labor,overhead=direct*(p.overhead/100),preProfit=direct+overhead,profit=preProfit*(p.profit/100),tax=material*(p.tax/100),total=preProfit+profit+tax;return{material,labor,hours,direct,overhead,profit,tax,total}}
function newProject(){let name=prompt("Project name?","New Bid");if(!name)return;let p={id:Date.now(),name,customer:"",number:"",notes:"",created:new Date().toISOString(),updated:new Date().toISOString(),tax:db.settings.tax,overhead:db.settings.overhead,profit:db.settings.profit,laborRate:db.settings.laborRate,lines:[]};db.projects.unshift(p);db.active=p.id;save();render();tab("takeoff")}
function deleteProject(id){if(confirm("Delete this bid?")){db.projects=db.projects.filter(p=>p.id!==id);if(db.active===id)db.active=db.projects[0]?.id||null;save();render()}}
function duplicateProject(id){let src=db.projects.find(p=>p.id===id);if(!src)return;let p=JSON.parse(JSON.stringify(src));p.id=Date.now();p.name=src.name+" - Copy";p.created=new Date().toISOString();p.updated=p.created;p.lines.forEach(l=>l.id=uid());db.projects.unshift(p);db.active=p.id;save();render();tab("takeoff")}
function openProject(id){db.active=id;save();render();tab("takeoff")}
function renderProjects(){let e=document.querySelector("#projects");e.innerHTML=`<div class="card"><div class="itemtop"><div><b>Saved Bids</b><div class="small">Pricing is frozen into each takeoff line when it is added.</div></div><button onclick="newProject()">+ New</button></div></div>`+(db.projects.length?db.projects.map(p=>{let c=calc(p);return`<div class="card"><div class="itemtop"><div><b>${esc(p.name)}</b><div class="small">${esc(p.customer||"No customer")} • ${new Date(p.created).toLocaleDateString()}</div></div><div class="right"><b>${money(c.total)}</b><div class="tiny">${c.hours.toFixed(1)} hrs</div></div></div><div class="actions" style="margin-top:10px"><button onclick="openProject(${p.id})">Open</button><button class="secondary" onclick="duplicateProject(${p.id})">Duplicate</button><button class="danger" onclick="deleteProject(${p.id})">Delete</button></div></div>`}).join(""):`<div class="card small">No bids yet. Create your first one.</div>`)}
function getTakeoffOptions(){let itemOpts=db.items.map(i=>`<option value="item:${i.id}">ITEM • ${esc(i.name)} — ${esc(i.unit)}</option>`).join("");let assOpts=db.assemblies.map(a=>`<option value="assembly:${a.id}">ASSEMBLY • ${esc(a.name)} — ${esc(a.unit||"EA")}</option>`).join("");return assOpts?`<optgroup label="Assemblies">${assOpts}</optgroup><optgroup label="Individual Items">${itemOpts}</optgroup>`:itemOpts}
function renderTakeoff(){let e=document.querySelector("#takeoff"),p=active();if(!p){e.innerHTML=`<div class="card">Create or open a project first.</div>`;return}e.innerHTML=`<div class="card"><b>${esc(p.name)}</b><div class="row"><div><label>Customer</label><input value="${esc(p.customer)}" oninput="upd('customer',this.value)"></div><div><label>Bid / Job #</label><input value="${esc(p.number)}" oninput="upd('number',this.value)"></div></div></div><div class="card noPrint"><b>Add Takeoff Item or Assembly</b><label>Selection</label><select id="pick">${getTakeoffOptions()}</select><div class="row"><div><label>Quantity</label><input id="qty" type="number" inputmode="decimal" value="1" min="0" step="any"></div><div style="align-self:end"><button style="width:100%" onclick="addLine()">Add to Takeoff</button></div></div><div class="small" style="margin-top:8px">Assemblies are added with an itemized price snapshot, so later database edits do not change old bids.</div></div><div class="card"><b>Itemized Takeoff</b>${p.lines.length?p.lines.map((l,n)=>lineHTML(l,n,p)).join(""):`<div class="small" style="margin-top:10px">No items added yet.</div>`}</div>`}
function lineHTML(l,n,p){let x=calcLine(l,p);let comps=l.snapshot?.components||[];return`<div class="item"><div class="itemtop"><div><b>${esc(l.name)}</b> ${l.kind==="assembly"?'<span class="pill accent">Assembly</span>':''}<div class="small">${l.qty} ${esc(l.unit)} • Material ${money(x.material)} • Labor ${money(x.labor)} • ${x.hours.toFixed(2)} hrs</div>${comps.length?`<details><summary class="tiny">View assembly breakdown</summary><div class="assemblybox">${comps.map(c=>`<div class="itemtop tiny"><span>${esc(c.qty)} × ${esc(c.name)}</span><span>${money((c.material||0)*c.qty)} + ${(c.laborHours*c.qty).toFixed(2)} hrs</span></div>`).join("")}</div></details>`:""}</div><button class="danger noPrint" onclick="rmLine(${n})">×</button></div></div>`}
function upd(k,v){let p=active();p[k]=v;p.updated=new Date().toISOString();save();renderSummary()}
function addLine(){let p=active(),[kind,id]=document.querySelector("#pick").value.split(":"),qty=+document.querySelector("#qty").value||0;if(qty<=0)return;if(kind==="item"){let i=db.items.find(x=>x.id===id);if(!i)return;p.lines.push({id:uid(),kind:"item",qty,name:i.name,unit:i.unit,cat:i.cat,snapshot:{material:+i.material||0,laborHours:+i.laborHours||0,components:[]}})}else{let a=db.assemblies.find(x=>x.id===id);if(!a)return;let s=assemblySnapshot(a);p.lines.push({id:uid(),kind:"assembly",qty,name:a.name,unit:a.unit||"EA",cat:a.cat||"Assembly",snapshot:s})}p.updated=new Date().toISOString();save();render()}
function rmLine(n){active().lines.splice(n,1);active().updated=new Date().toISOString();save();render()}
function renderSummary(){let e=document.querySelector("#summary"),p=active();if(!p){e.innerHTML=`<div class="card">Create or open a project first.</div>`;return}let c=calc(p);e.innerHTML=`<div class="card"><div class="small">ESTIMATED BID TOTAL</div><div class="money">${money(c.total)}</div><div class="small">${esc(p.name)}${p.customer?" • "+esc(p.customer):""}</div></div><div class="card"><b>Bid Controls</b><div class="row"><div><label>Labor Rate ($/hr)</label><input type="number" step=".01" value="${p.laborRate}" onchange="numupd('laborRate',this.value)"></div><div><label>Tax %</label><input type="number" step=".001" value="${p.tax}" onchange="numupd('tax',this.value)"></div><div><label>Overhead %</label><input type="number" step=".01" value="${p.overhead}" onchange="numupd('overhead',this.value)"></div><div><label>Profit %</label><input type="number" step=".01" value="${p.profit}" onchange="numupd('profit',this.value)"></div></div></div><div class="card"><b>Cost Breakdown</b><div class="totals" style="margin-top:12px"><div>Material</div><div>${money(c.material)}</div><div>Labor</div><div>${money(c.labor)}</div><div>Total Labor Hours</div><div>${c.hours.toFixed(2)}</div><div>Direct Cost</div><div>${money(c.direct)}</div><div>Overhead</div><div>${money(c.overhead)}</div><div>Profit</div><div>${money(c.profit)}</div><div>Tax</div><div>${money(c.tax)}</div><div style="font-size:18px"><b>Total</b></div><div style="font-size:18px">${money(c.total)}</div></div></div><div class="card noPrint"><div class="actions"><button onclick="window.print()">Save / Print PDF</button><button class="secondary" onclick="exportCSV()">Export CSV</button><button class="secondary" onclick="exportProject()">Project Backup</button></div></div>`}
function numupd(k,v){active()[k]=+v||0;active().updated=new Date().toISOString();save();renderSummary()}
let settingsView="items";let editingAssemblyId=null;let draftAssembly=null;
function renderSettings(){let e=document.querySelector("#settings");e.innerHTML=`<div class="card"><b>App & Default Bid Settings</b><div class="row"><div><label>Labor Rate ($/hr)</label><input id="sLab" type="number" value="${db.settings.laborRate}"></div><div><label>Tax %</label><input id="sTax" type="number" value="${db.settings.tax}"></div><div><label>Overhead %</label><input id="sOH" type="number" value="${db.settings.overhead}"></div><div><label>Profit %</label><input id="sProfit" type="number" value="${db.settings.profit}"></div><div><label>Accent Color</label><input id="sAccent" type="color" value="${db.settings.accent}"></div><div><label>Background Color</label><input id="sBg" type="color" value="${db.settings.background}"></div></div><button style="margin-top:10px;width:100%" onclick="saveSettings()">Save Defaults & Theme</button></div><div class="tabs noPrint"><button class="secondary ${settingsView==='items'?'selected':''}" onclick="settingsView='items';renderSettings()">Items</button><button class="secondary ${settingsView==='assemblies'?'selected':''}" onclick="settingsView='assemblies';renderSettings()">Assemblies</button></div>${settingsView==='items'?renderItemDB():renderAssemblyDB()}<div class="card"><b>Data</b><div class="actions" style="margin-top:10px"><button class="secondary" onclick="exportAll()">Export All Data</button><button class="secondary" onclick="document.querySelector('#restore').click()">Restore Backup</button><input id="restore" class="hidden" type="file" accept=".json" onchange="restoreAll(this.files[0])"></div></div>`}
function renderItemDB(){return`<div class="card"><div class="sectiontitle"><div><b>Item Database</b><div class="small">These are the building blocks used by individual takeoff lines and assemblies.</div></div></div><div class="row3" style="margin-top:10px"><input id="iName" placeholder="Item name"><input id="iUnit" placeholder="Unit"><input id="iCat" placeholder="Category"></div><div class="row"><div><label>Material $ / unit</label><input id="iMat" type="number" step=".01"></div><div><label>Labor hours / unit</label><input id="iHrs" type="number" step=".001"></div></div><button style="width:100%" onclick="addDBItem()">Add Database Item</button><input id="itemSearch" class="search" style="margin-top:12px" placeholder="Search items..." oninput="filterItems(this.value)"><div id="itemList">${itemListHTML(db.items)}</div></div>`}
function itemListHTML(arr){return arr.map(i=>`<div class="item" data-name="${esc(i.name.toLowerCase())}"><div class="itemtop"><div><b>${esc(i.name)}</b><div class="small">${esc(i.cat)} • ${esc(i.unit)} • ${money(i.material)}/unit • ${i.laborHours} labor hr/unit</div></div><div class="actions"><button class="ghost" onclick="editItem('${i.id}')">Edit</button><button class="danger" onclick="delDB('${i.id}')">×</button></div></div></div>`).join("")}
function filterItems(q){let x=q.toLowerCase();document.querySelectorAll('#itemList .item').forEach(el=>el.classList.toggle('hidden',!el.dataset.name.includes(x)))}
function editItem(id){let i=db.items.find(x=>x.id===id);if(!i)return;let name=prompt("Item name",i.name);if(name===null)return;let cat=prompt("Category",i.cat);if(cat===null)return;let unit=prompt("Unit",i.unit);if(unit===null)return;let material=prompt("Material cost per unit",i.material);if(material===null)return;let labor=prompt("Labor hours per unit",i.laborHours);if(labor===null)return;Object.assign(i,{name,cat,unit,material:+material||0,laborHours:+labor||0});save();renderSettings()}
function addDBItem(){let name=iName.value.trim(),unit=iUnit.value.trim()||"EA",cat=iCat.value.trim()||"General";if(!name)return;db.items.push({id:uid(),name,unit,cat,material:+iMat.value||0,laborHours:+iHrs.value||0});save();renderSettings()}
function delDB(id){let used=db.assemblies.some(a=>a.components?.some(c=>c.itemId===id));if(used){alert("This item is used in one or more assemblies. Remove it from those assemblies first.");return}if(confirm("Delete this database item?")){db.items=db.items.filter(i=>i.id!==id);save();renderSettings()}}
function blankAssembly(){return{id:uid(),name:"",cat:"Assembly",unit:"EA",markup:0,components:[]}}
function renderAssemblyDB(){if(!draftAssembly)draftAssembly=blankAssembly();let a=draftAssembly;let sums=assemblyTotals(a);let opts=db.items.map(i=>`<option value="${i.id}">${esc(i.name)} — ${esc(i.unit)}</option>`).join("");return`<div class="card"><div class="sectiontitle"><div><b>${editingAssemblyId?'Edit Assembly':'Create Assembly'}</b><div class="small">Build reusable takeoff assemblies from your item database.</div></div>${editingAssemblyId?'<button class="ghost" onclick="cancelAssemblyEdit()">Cancel</button>':''}</div><div class="row3"><div><label>Assembly Name</label><input id="aName" value="${esc(a.name)}" placeholder="e.g. Standard Cat6 Data Drop" oninput="draftAssembly.name=this.value"></div><div><label>Unit</label><input id="aUnit" value="${esc(a.unit||'EA')}" oninput="draftAssembly.unit=this.value"></div><div><label>Category</label><input id="aCat" value="${esc(a.cat||'Assembly')}" oninput="draftAssembly.cat=this.value"></div></div><div class="row"><div><label>Assembly Material Markup %</label><input id="aMarkup" type="number" step=".01" value="${a.markup||0}" oninput="draftAssembly.markup=+this.value||0;updateAssemblyPreview()"></div><div><label>Pricing Method</label><input value="Calculated from components" disabled></div></div><div class="divider"></div><b>Add Component</b><div class="row3"><select id="compItem">${opts}</select><input id="compQty" type="number" value="1" min="0" step="any" placeholder="Qty"><button onclick="addComponent()">Add</button></div><div id="assemblyComponents">${assemblyComponentsHTML(a)}</div><div id="assemblyPreview" class="assemblybox">${assemblyPreviewHTML(a,sums)}</div><button style="width:100%" onclick="saveAssembly()">${editingAssemblyId?'Update Assembly':'Save Assembly'}</button></div><div class="card"><b>Saved Assemblies</b>${db.assemblies.length?db.assemblies.map(a=>{let s=assemblyTotals(a);return`<div class="item"><div class="itemtop"><div><b>${esc(a.name)}</b><div class="small">${a.components.length} components • ${money(s.material)} material • ${s.laborHours.toFixed(2)} labor hrs / ${esc(a.unit||'EA')}</div></div><div class="actions"><button class="ghost" onclick="editAssembly('${a.id}')">Edit</button><button class="danger" onclick="deleteAssembly('${a.id}')">×</button></div></div></div>`}).join(""):'<div class="small" style="margin-top:10px">No assemblies yet. Create your first above.</div>'}</div>`}
function assemblyComponentsHTML(a){if(!a.components.length)return'<div class="small" style="margin:10px 0">No components added yet.</div>';return a.components.map((c,n)=>{let i=db.items.find(x=>x.id===c.itemId);if(!i)return'';return`<div class="item"><div class="itemtop"><div><b>${esc(i.name)}</b><div class="small">${c.qty} × ${esc(i.unit)} • ${money(i.material*c.qty)} material • ${(i.laborHours*c.qty).toFixed(3)} hrs</div></div><button class="danger" onclick="removeComponent(${n})">×</button></div></div>`}).join('')}
function assemblyTotals(a){let material=0,laborHours=0;a.components.forEach(c=>{let i=db.items.find(x=>x.id===c.itemId);if(i){material+=(+i.material||0)*(+c.qty||0);laborHours+=(+i.laborHours||0)*(+c.qty||0)}});let markup=material*((+a.markup||0)/100);return{rawMaterial:material,markup,material:material+markup,laborHours}}
function assemblyPreviewHTML(a,s=assemblyTotals(a)){let labor=s.laborHours*(+db.settings.laborRate||0);return`<div class="itemtop"><b>Assembly Price Breakdown</b><span class="pill">per ${esc(a.unit||'EA')}</span></div><div class="totals" style="margin-top:8px"><div>Raw component material</div><div>${money(s.rawMaterial)}</div><div>Assembly material markup (${+a.markup||0}%)</div><div>${money(s.markup)}</div><div>Material sell basis</div><div>${money(s.material)}</div><div>Labor hours</div><div>${s.laborHours.toFixed(3)}</div><div>Labor @ default ${money(db.settings.laborRate)}/hr</div><div>${money(labor)}</div><div><b>Assembly direct price</b></div><div><b>${money(s.material+labor)}</b></div></div>`}
function updateAssemblyPreview(){let el=document.querySelector('#assemblyPreview');if(el)el.innerHTML=assemblyPreviewHTML(draftAssembly)}
function addComponent(){let id=compItem.value,qty=+compQty.value||0;if(!id||qty<=0)return;let existing=draftAssembly.components.find(c=>c.itemId===id);if(existing)existing.qty+=qty;else draftAssembly.components.push({itemId:id,qty});renderSettings()}
function removeComponent(n){draftAssembly.components.splice(n,1);renderSettings()}
function saveAssembly(){draftAssembly.name=(document.querySelector('#aName')?.value||draftAssembly.name).trim();draftAssembly.unit=(document.querySelector('#aUnit')?.value||draftAssembly.unit||'EA').trim();draftAssembly.cat=(document.querySelector('#aCat')?.value||draftAssembly.cat||'Assembly').trim();draftAssembly.markup=+document.querySelector('#aMarkup')?.value||0;if(!draftAssembly.name){alert('Give the assembly a name.');return}if(!draftAssembly.components.length){alert('Add at least one component.');return}if(editingAssemblyId){let idx=db.assemblies.findIndex(x=>x.id===editingAssemblyId);db.assemblies[idx]=JSON.parse(JSON.stringify(draftAssembly))}else db.assemblies.push(JSON.parse(JSON.stringify(draftAssembly)));editingAssemblyId=null;draftAssembly=blankAssembly();save();renderSettings()}
function editAssembly(id){let a=db.assemblies.find(x=>x.id===id);if(!a)return;editingAssemblyId=id;draftAssembly=JSON.parse(JSON.stringify(a));settingsView='assemblies';renderSettings();window.scrollTo({top:0,behavior:'smooth'})}
function cancelAssemblyEdit(){editingAssemblyId=null;draftAssembly=blankAssembly();renderSettings()}
function deleteAssembly(id){if(confirm('Delete this assembly? Existing project takeoff lines will remain because their pricing is frozen.')){db.assemblies=db.assemblies.filter(a=>a.id!==id);if(editingAssemblyId===id)cancelAssemblyEdit();save();renderSettings()}}
function assemblySnapshot(a){let comps=[];let rawMat=0,h=0;a.components.forEach(c=>{let i=db.items.find(x=>x.id===c.itemId);if(!i)return;let q=+c.qty||0;rawMat+=(+i.material||0)*q;h+=(+i.laborHours||0)*q;comps.push({name:i.name,unit:i.unit,qty:q,material:+i.material||0,laborHours:+i.laborHours||0})});return{material:rawMat*(1+(+a.markup||0)/100),laborHours:h,components:comps,assemblyMarkup:+a.markup||0}}
function saveSettings(){db.settings={laborRate:+sLab.value||0,tax:+sTax.value||0,overhead:+sOH.value||0,profit:+sProfit.value||0,accent:sAccent.value,background:sBg.value};save();applyTheme();render()}
function dl(name,text,type){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function exportProject(){let p=active();dl((p.name||"bid")+".bidforge.json",JSON.stringify({version:"1.1",project:p,items:db.items,assemblies:db.assemblies},null,2),"application/json")}
function exportAll(){dl("BidForge-v1.1-backup.json",JSON.stringify(db,null,2),"application/json")}
function restoreAll(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);migrate();applyTheme();render();alert("Backup restored.")}catch(e){alert("That backup could not be read.")}};r.readAsText(f)}
function exportCSV(){let p=active(),rows=[["Type","Item / Assembly","Category","Unit","Qty","Material Ext","Labor Hours","Labor Ext"]];p.lines.forEach(l=>{let x=calcLine(l,p);rows.push([l.kind,l.name,l.cat,l.unit,l.qty,x.material,x.hours,x.labor])});rows.push([]);let c=calc(p);rows.push(["TOTAL","","","","",c.material,c.hours,c.total]);let csv=rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");dl((p.name||"bid")+".csv",csv,"text/csv")}
function tab(id){document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("hidden",s.id!==id));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===id))}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function applyTheme(){document.documentElement.style.setProperty("--accent",db.settings.accent||"#f59e0b");document.documentElement.style.setProperty("--bg",db.settings.background||"#0b1220");let bg=db.settings.background||"#0b1220";let rgb=parseInt(bg.slice(1),16),r=(rgb>>16)&255,g=(rgb>>8)&255,b=rgb&255;let lum=(.299*r+.587*g+.114*b)/255;if(lum>.65){document.documentElement.style.setProperty('--text','#111827');document.documentElement.style.setProperty('--muted','#475569');document.documentElement.style.setProperty('--card','rgba(255,255,255,.78)');document.documentElement.style.setProperty('--panel','rgba(255,255,255,.92)');document.documentElement.style.setProperty('--input','rgba(255,255,255,.9)');document.documentElement.style.setProperty('--line','#cbd5e1')}else{document.documentElement.style.setProperty('--text','#f8fafc');document.documentElement.style.setProperty('--muted','#9ca3af');document.documentElement.style.setProperty('--card','#172033');document.documentElement.style.setProperty('--panel','#111827');document.documentElement.style.setProperty('--input','#0d1628');document.documentElement.style.setProperty('--line','#2b364a')}}
function render(){applyTheme();renderProjects();renderTakeoff();renderSummary();renderSettings()}
migrate();render();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
